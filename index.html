<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>
  <style>
    body {
      background: #ffd6e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-bottom: 30px;
    }

    button {
      padding: 15px 35px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin: 10px;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
    }

    #no {
      background-color: #555;
      color: white;
    }

    .bounce {
      animation: bounce 0.6s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-15px); }
    }

    #result {
      margin-top: 30px;
      font-size: 26px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Will you be my Valentine? 💘</h1>

  <div>
    <button id="yes">Yes ❤️</button>
    <button id="no">No 💔</button>
  </div>

  <div id="result"></div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const result = document.getElementById("result");

    yesBtn.onclick = () => {
      result.style.display = "block";
      result.innerHTML = "Yay! You said YES 😍💖";
    };

    noBtn.onclick = () => {
      noBtn.innerHTML = "beta bushra 🤚💥";
      noBtn.classList.add("bounce");
    };
  </script>

</body>
</html>
